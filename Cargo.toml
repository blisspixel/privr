[package]
name = "privr"
version = "0.0.1"
edition = "2024"
description = "Privacy-first settings audit, drift detection, remediation, and rollback"
license = "Apache-2.0"
repository = "https://github.com/blisspixel/privr"
rust-version = "1.95"
keywords = ["privacy", "security", "cli", "compliance", "hardening"]
categories = ["command-line-utilities", "config"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = true
