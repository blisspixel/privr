<svg xmlns="http://www.w3.org/2000/svg" width="820" height="634" viewBox="0 0 820 634" role="img" aria-label="Illustrative privr check output on Windows 11 Pro, showing drift, a not-applicable edition-gated control, a review item with a mitigation, and an unknown result.">
  <rect x="0" y="0" width="820" height="634" rx="10" fill="#0c0c0c"/>
  <rect x="0" y="0" width="820" height="34" rx="10" fill="#1f1f1f"/>
  <rect x="0" y="24" width="820" height="10" fill="#1f1f1f"/>
  <circle cx="20" cy="17" r="5" fill="#3f3f3f"/>
  <circle cx="38" cy="17" r="5" fill="#3f3f3f"/>
  <circle cx="56" cy="17" r="5" fill="#3f3f3f"/>
  <text x="410" y="22" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="12" fill="#9a9a9a" text-anchor="middle">Windows PowerShell</text>
  <g font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="14">
    <text x="24" y="66"><tspan fill="#7ec699">PS C:\&gt;</tspan><tspan fill="#e6e6e6" xml:space="preserve"> privr check</tspan></text>
    <text x="24" y="106" fill="#7f848e">Profile<tspan fill="#e6e6e6" xml:space="preserve">   baseline@0.1</tspan></text>
    <text x="24" y="126" fill="#7f848e">Platform<tspan fill="#e6e6e6" xml:space="preserve">  Windows 11 Pro 24H2 (26100)</tspan></text>
    <text x="24" y="146" fill="#7f848e">Result<tspan fill="#e5c07b" xml:space="preserve">    incomplete</tspan></text>
    <text x="24" y="180"><tspan fill="#98c379">14 pass</tspan><tspan fill="#e5c07b" xml:space="preserve">   3 drift</tspan><tspan fill="#61afef" xml:space="preserve">   2 review</tspan><tspan fill="#c678dd" xml:space="preserve">   1 unknown</tspan><tspan fill="#7f848e" xml:space="preserve">   2 not evaluated</tspan></text>
    <text x="24" y="220" fill="#d7d7d7">Diagnostics</text>
    <text x="24" y="244"><tspan fill="#e5c07b" xml:space="preserve">  DRIFT    </tspan><tspan fill="#e6e6e6">windows.error-reporting.transmission</tspan></text>
    <text x="24" y="264" fill="#7f848e" xml:space="preserve">           Current      send automatically</text>
    <text x="24" y="284" fill="#7f848e" xml:space="preserve">           Desired      automatic transmission disabled</text>
    <text x="24" y="304" fill="#7f848e" xml:space="preserve">           Source       local machine policy</text>
    <text x="24" y="324" fill="#7f848e" xml:space="preserve">           Fix          automatic, administrator required</text>
    <text x="24" y="356"><tspan fill="#7f848e" xml:space="preserve">  N/A      </tspan><tspan fill="#9aa0a6">windows.diagnostics.level</tspan></text>
    <text x="24" y="376" fill="#7f848e" xml:space="preserve">           Value 0 is not applicable to Windows 11 Pro.</text>
    <text x="24" y="396" fill="#7f848e" xml:space="preserve">           Microsoft documents it as equivalent to 1 outside</text>
    <text x="24" y="416" fill="#7f848e" xml:space="preserve">           Enterprise, Education, and Server.</text>
    <text x="24" y="450" fill="#d7d7d7">Search</text>
    <text x="24" y="474"><tspan fill="#61afef" xml:space="preserve">  REVIEW   </tspan><tspan fill="#e6e6e6">windows.search.cloud-content</tspan></text>
    <text x="24" y="494" fill="#7f848e" xml:space="preserve">           Tradeoff     cloud file results no longer appear</text>
    <text x="24" y="514" fill="#7f848e" xml:space="preserve">           Mitigation   local file search is unaffected</text>
    <text x="24" y="548" fill="#d7d7d7">Activity</text>
    <text x="24" y="572"><tspan fill="#c678dd" xml:space="preserve">  UNKNOWN  </tspan><tspan fill="#e6e6e6">windows.activity.upload</tspan></text>
    <text x="24" y="592" fill="#7f848e" xml:space="preserve">           Effective policy could not be determined. Reported</text>
    <text x="24" y="612" fill="#7f848e" xml:space="preserve">           as unknown, not as passing.</text>
  </g>
</svg>
